<style>
  :root {
    --bg:#0C0C0C; --raised:#151514; --line:#232322; --line-2:#1B1B1A;
    --fg:#E8E6E3; --fg-2:#9C9995; --fg-3:#6A6763; --fg-4:#45433F;
    --accent:#E8734A; --accent-2:#8C4429; --warn:#C0392B;
    --font:"Chakra Petch",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0 0 calc(96px + env(safe-area-inset-bottom));
    background:var(--bg);color:var(--fg);font-family:var(--font);
    font-size:17px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:580px;margin:0 auto;padding:0 22px}

  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .eyebrow.mute{color:var(--fg-3)}

  header{padding:calc(46px + env(safe-area-inset-top)) 0 22px}
  header h1{margin:20px 0 0;font-size:clamp(38px,11vw,52px);font-weight:700;line-height:1;letter-spacing:-.01em}
  header p{margin:14px 0 0;font-size:16px;font-weight:300;line-height:1.6;color:var(--fg-2);max-width:36ch}

  /* ---------- tabs ---------- */
  .tabs-wrap{
    position:sticky;top:0;z-index:20;margin:26px -22px 0;padding:12px 0 0;
    background:rgba(12,12,12,.86);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  }
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 22px 12px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:9px 16px;border:1px solid var(--line);border-radius:999px;
    background:none;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
    letter-spacing:.06em;color:var(--fg-3);white-space:nowrap;transition:all .18s ease;
  }
  .tab:hover{color:var(--fg-2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .tab .n{opacity:.6;margin-left:7px;font-weight:400}
  .tab-add{flex:0 0 auto;padding:9px 14px;border:1px dashed var(--line);border-radius:999px;background:none;cursor:pointer;color:var(--fg-3);font-size:15px;line-height:1}
  .track{height:2px;background:var(--line)}
  .track span{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}

  /* ---------- tab head ---------- */
  .tabhead{display:flex;align-items:baseline;gap:12px;margin:30px 0 6px}
  .tabhead h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .tabhead .meta{margin-left:auto;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap}
  .tabnote{margin:0 0 22px;font-size:14.5px;font-weight:300;line-height:1.6;color:var(--fg-2);max-width:40ch}

  /* ---------- tasks ---------- */
  .task{border-top:1px solid var(--line-2);position:relative}
  .task:last-of-type{border-bottom:1px solid var(--line-2)}
  .task.drag{background:var(--raised);border-radius:8px;border-color:transparent}
  .row{display:flex;align-items:center}
  .tick{flex:0 0 auto;width:46px;height:62px;margin-left:-13px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
  .tick i{
    display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--fg-4);font-style:normal;font-size:10px;font-weight:700;color:transparent;
    transition:background .2s ease,border-color .2s ease,transform .13s ease;
  }
  .tick:active i{transform:scale(.86)}
  .task.done .tick i{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .body{flex:1 1 auto;min-width:0;text-align:left;border:0;background:none;padding:15px 8px 15px 0;cursor:pointer;font:inherit;color:inherit}
  .t-title{display:block;font-size:16px;font-weight:500;line-height:1.38}
  .task.done .t-title{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--fg-4)}
  .t-sub{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:5px;font-size:11.5px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
  .t-sub .due.soon{color:var(--accent)}
  .t-sub .due.late{color:var(--warn)}
  .t-sub .exp{color:var(--fg-4)}
  .kill{flex:0 0 auto;height:46px;min-width:46px;margin-right:-10px;border:0;background:none;cursor:pointer;display:grid;place-items:center;font:inherit;font-size:16px;font-weight:300;color:var(--fg-4);transition:color .18s ease}
  .kill:hover{color:var(--fg-2)}
  .kill.arm{min-width:0;height:28px;padding:0 13px;margin-right:0;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

  .movers{display:flex;gap:8px;align-items:center;padding:0 0 14px 46px}
  .movers button{
    padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:none;cursor:pointer;
    font:inherit;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);
  }
  .movers button.go{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .movers button:disabled{opacity:.3;cursor:default}

  .empty{padding:40px 0;text-align:center;font-size:14.5px;font-weight:300;color:var(--fg-3)}

  /* ---------- buttons ---------- */
  .add{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:8px 0;border:0;background:none;cursor:pointer;font:inherit;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);transition:color .18s ease}
  .add:hover{color:var(--accent)}
  .add b{font-weight:400;font-size:16px;line-height:1}

  .fab{
    position:fixed;right:22px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;
    width:54px;height:54px;border:0;border-radius:50%;cursor:pointer;
    background:var(--accent);color:var(--bg);font-size:26px;line-height:1;font-weight:300;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .fab:active{transform:scale(.94)}

  .topbar{display:flex;align-items:center;gap:10px}
  .tools{margin-left:auto;display:flex;gap:6px}
  .tool{
    position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;
    background:none;cursor:pointer;color:var(--fg-3);display:grid;place-items:center;
    transition:color .18s ease,border-color .18s ease,background .18s ease;
  }
  .tool:hover{color:var(--fg);border-color:var(--fg-4)}
  .tool:active{transform:scale(.94)}
  .tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .badge{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--fg-4);border:2px solid var(--bg);transition:background .25s}
  .badge.on{background:var(--accent)} .badge.busy{background:var(--fg-2)} .badge.err{background:var(--warn)} .badge.off{display:none}
  .tool.live{color:var(--accent);border-color:var(--accent-2)}

  .mrow{
    display:flex;align-items:center;gap:15px;width:100%;padding:17px 0;
    border:0;border-top:1px solid var(--line-2);background:none;cursor:pointer;font:inherit;color:var(--fg);text-align:left;
  }
  .mrow:first-child{border-top:0}
  .mrow .ic{flex:0 0 auto;color:var(--fg-3);display:grid;place-items:center}
  .mrow .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mrow.hot .ic{color:var(--accent)}
  .mrow .lab{flex:1;min-width:0}
  .mrow .lab b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.005em}
  .mrow .lab span{display:block;margin-top:3px;font-size:11px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3)}
  .mrow .chev{flex:0 0 auto;color:var(--fg-4);font-size:17px;font-weight:300}

  .log{margin-top:4px}
  .log-item{display:flex;gap:14px;padding:11px 0;font-size:13px;font-weight:300;line-height:1.45;color:var(--fg-2);border-top:1px solid var(--line-2)}
  .log-item:first-child{border-top:0}
  .log-item time{flex:0 0 auto;font-size:11px;letter-spacing:.05em;color:var(--fg-4);white-space:nowrap;padding-top:1px}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.64);opacity:0;pointer-events:none;transition:opacity .3s ease}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:580px;margin:0 auto;
    background:var(--raised);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:12px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1);
    max-height:92vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 22px}
  .sheet h3{margin:0 0 8px;font-size:23px;font-weight:600;letter-spacing:-.01em}
  .sheet .sub{margin:0 0 26px;font-size:14px;font-weight:300;line-height:1.55;color:var(--fg-3)}

  .field{margin-bottom:20px}
  .field label{display:block;margin-bottom:9px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;
    font:inherit;font-size:16.5px;font-weight:400;color:var(--fg);-webkit-appearance:none;appearance:none;
  }
  .field textarea{min-height:58px;resize:vertical;line-height:1.5}
  .field select{padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 11px) 21px,calc(100% - 6px) 21px;background-size:5px 5px;background-repeat:no-repeat}
  .field input:focus,.field textarea:focus,.field select:focus{outline:0;border-bottom-color:var(--accent)}
  .field input::placeholder,.field textarea::placeholder{color:var(--fg-4)}
  .field input[type=date],.field input[type=time]{color-scheme:dark}
  .two{display:flex;gap:16px}
  .two>*{flex:1;min-width:0}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:none;cursor:pointer;
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--fg-3);transition:all .16s ease;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .hint{margin:10px 0 0;font-size:12.5px;font-weight:300;line-height:1.55;color:var(--fg-4)}
  .hint b{font-weight:600;color:var(--fg-3)}
  .hint ol{margin:8px 0 0;padding-left:18px}
  .hint li{margin-bottom:4px}
  .idbox{display:flex;align-items:center;gap:10px;margin-top:6px;padding:11px 13px;border:1px solid var(--line);border-radius:6px}
  .idbox code{flex:1;min-width:0;font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idbox button{flex:0 0 auto;padding:5px 11px;border:0;border-radius:999px;cursor:pointer;background:var(--accent);color:var(--bg);font:inherit;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

  .acts{display:flex;gap:11px;margin-top:28px}
  .acts button{flex:1;padding:16px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;transition:transform .12s ease}
  .acts button:active{transform:scale(.97)}
  .no{border:1px solid var(--line);background:none;color:var(--fg-2)}
  .yes{border:0;background:var(--accent);color:var(--bg)}
  .danger{margin-top:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:999px;background:none;cursor:pointer;font:inherit;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--warn)}
  .danger.arm{background:var(--warn);border-color:var(--warn);color:#fff}

  @keyframes spin{to{transform:rotate(360deg)}}
  .tool.spin svg{animation:spin .85s linear infinite}

  .ptr{
    position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;z-index:35;
    width:34px;height:34px;margin-left:-17px;border-radius:50%;
    background:var(--raised);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--fg-3);
    transform:translateY(-58px);opacity:0;pointer-events:none;
    transition:transform .22s ease,opacity .22s ease,color .18s ease;
  }
  .ptr svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ptr.ready{color:var(--accent);border-color:var(--accent-2)}
  .ptr.busy{transform:translateY(14px)!important;opacity:1!important}
  .ptr.busy svg{animation:spin .85s linear infinite}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="topbar">
      <span class="eyebrow" id="hEyebrow">Tracker</span>
      <div class="tools">
        <button class="tool" id="btnNotif" aria-label="Reminders" title="Reminders"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="bNotif"></span></button>
        <button class="tool" id="btnSync" aria-label="Sync" title="Sync"><svg viewBox="0 0 24 24"><path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span class="badge" id="bSync"></span></button>
        <button class="tool" id="btnLog" aria-label="History" title="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.4 2"/></svg></button>
        <button class="tool" id="btnMenu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="2" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </div>
    <h1 id="hTitle">Tracker</h1>
    <p id="hIntro">Tabs for whatever you're keeping track of. Tap a task to edit it, hold it to move it.</p>
  </header>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
    <div class="track"><span id="track"></span></div>
  </div>

  <main id="main"></main>

</div>

<div class="ptr" id="ptr"><svg viewBox="0 0 24 24"><path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></div>

<button class="fab" id="fab" aria-label="Add task">＋</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sheetTitle"></h3>
  <p class="sub" id="sheetSub"></p>
  <div id="sheetFields"></div>
  <div class="acts">
    <button class="no" id="sheetCancel">Cancel</button>
    <button class="yes" id="sheetGo">Save</button>
  </div>
  <div id="sheetExtra"></div>
</div>

<script>
/* ============================ state ============================ */
const KEY = "tracker-v1";
const EMPTY = () => ({
  title: "Tracker",
  eyebrow: "Tracker",
  intro: "Tabs for whatever you're keeping track of. Tap a task to edit it, hold it to move it.",
  tabs: [], tasks: [], log: [], fired: {}, activeTab: "", updatedAt: 0
});
let S = EMPTY();
let reorderId = null;

const norm = o => Object.assign(EMPTY(), o || {});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================ storage ============================ */
const mem = {};
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const store = {
  async get(k){ if(window.storage){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } } return ls.get(k); },
  async set(k,v){ if(window.storage){ try{ await window.storage.set(k,v); }catch(e){} return; } ls.set(k,v); }
};

/* ============================ gist sync ============================ */
const FILE = "tracker.json";
const SYNC = {
  get token(){ return ls.get("gh_token") || ""; },
  set token(v){ v ? ls.set("gh_token", v) : ls.del("gh_token"); },
  get gist(){ return ls.get("gh_gist") || ""; },
  set gist(v){ v ? ls.set("gh_gist", v) : ls.del("gh_gist"); },
  get on(){ return !!(this.token && this.gist); },
  head(){ return { "Authorization":"Bearer "+this.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", "Content-Type":"application/json" }; },
  async create(state){
    const r = await fetch("https://api.github.com/gists", { method:"POST", headers:this.head(),
      body: JSON.stringify({ description:"Tracker state", public:false, files:{ [FILE]:{ content: JSON.stringify(state,null,2) } } }) });
    if(!r.ok) throw new Error("create failed ("+r.status+")");
    return (await r.json()).id;
  },
  async pull(){
    const r = await fetch("https://api.github.com/gists/"+this.gist+"?t="+Date.now(), { headers:this.head(), cache:"no-store" });
    if(!r.ok) throw new Error("pull failed ("+r.status+")");
    const j = await r.json(); const f = j.files && j.files[FILE];
    if(!f) return null;
    let text = f.content;
    if(f.truncated && f.raw_url) text = await (await fetch(f.raw_url,{cache:"no-store"})).text();
    try{ return JSON.parse(text); }catch(e){ return null; }
  },
  async push(state){
    const r = await fetch("https://api.github.com/gists/"+this.gist, { method:"PATCH", headers:this.head(),
      body: JSON.stringify({ files:{ [FILE]:{ content: JSON.stringify(state,null,2) } } }) });
    if(!r.ok) throw new Error("push failed ("+r.status+")");
  }
};
let lastSynced = 0, pushTimer = null;
let syncMsg = "Local only";
function syncSet(kind,msg){
  syncMsg = msg;
  const b = document.getElementById("bSync"), tool = document.getElementById("btnSync");
  if(b) b.className = "badge" + (kind ? " " + kind : "");
  if(tool) tool.classList.toggle("live", kind === "on");
  const row = document.getElementById("mSyncStatus"); if(row) row.textContent = msg;
}
function syncIdle(){
  if(!SYNC.on){ syncSet("","Local only"); return; }
  const s = lastSynced ? Math.round((Date.now()-lastSynced)/1000) : 0;
  syncSet("on", !lastSynced ? "Synced" : (s<60 ? "Synced just now" : "Synced "+Math.round(s/60)+"m ago"));
}
function schedulePush(){ if(!SYNC.on) return; clearTimeout(pushTimer); pushTimer=setTimeout(doPush,1200); }
async function doPush(){ if(!SYNC.on) return; syncSet("busy","Saving to GitHub");
  try{ await SYNC.push(S); lastSynced=Date.now(); syncIdle(); }catch(e){ syncSet("err", e.message||String(e)); } }
async function doPull(quiet){
  if(!SYNC.on) return;
  if(!quiet) syncSet("busy","Checking GitHub");
  try{
    const r = await SYNC.pull();
    if(r && (r.updatedAt||0) > (S.updatedAt||0)){ S = norm(r); await store.set(KEY, JSON.stringify(S)); render(); lastSynced=Date.now(); syncSet("on","Updated from GitHub"); setTimeout(syncIdle,2500); return; }
    if(r && (S.updatedAt||0) > (r.updatedAt||0)){ await doPush(); return; }
    lastSynced=Date.now(); syncIdle();
  }catch(e){ syncSet("err", e.message||String(e)); }
}

/* ============================ log + save ============================ */
function logIt(msg){
  S.log.unshift({ ts: Date.now(), msg });
  if(S.log.length > 400) S.log.length = 400;
}
async function save(){
  S.updatedAt = Date.now();
  try{ await store.set(KEY, JSON.stringify(S)); }catch(e){}
  schedulePush();
}
function commit(msg){ if(msg) logIt(msg); render(); save(); }

/* ============================ helpers ============================ */
const REMINDERS = [
  { v:0,     l:"At time" },
  { v:10,    l:"10 min" },
  { v:30,    l:"30 min" },
  { v:60,    l:"1 hour" },
  { v:180,   l:"3 hours" },
  { v:1440,  l:"1 day" },
  { v:2880,  l:"2 days" },
  { v:10080, l:"1 week" }
];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function dueDate(t){
  if(!t.date) return null;
  return new Date(t.date + "T" + (t.time || "09:00") + ":00");
}
function fmtDue(t){
  const d = dueDate(t); if(!d) return "";
  const today = new Date(); today.setHours(0,0,0,0);
  const day = new Date(t.date + "T00:00:00");
  const diff = Math.round((day - today) / 86400000);
  const when = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday"
    : (diff > 1 && diff < 7) ? DAYS[day.getDay()]
    : day.toLocaleDateString(undefined,{ day:"numeric", month:"short", year: day.getFullYear()!==today.getFullYear() ? "numeric" : undefined });
  return when + (t.time ? " · " + t.time : "");
}
function dueClass(t){
  const d = dueDate(t); if(!d) return "";
  const ms = d - Date.now();
  if(ms < 0) return "late";
  if(ms < 86400000) return "soon";
  return "";
}
function expired(t){ return t.expires && new Date(t.expires + "T23:59:59") < new Date(); }
const tabTasks = id => S.tasks.filter(t => t.tabId === id).sort((a,b) => (a.order||0) - (b.order||0));
const activeTab = () => S.tabs.find(x => x.id === S.activeTab) || S.tabs[0];

/* ============================ render ============================ */
const mainEl = document.getElementById("main");

function render(){
  document.getElementById("hTitle").textContent = S.title || "Tracker";
  document.getElementById("hEyebrow").textContent = S.eyebrow || "Tracker";
  document.getElementById("hIntro").textContent = S.intro || "";

  if(S.tabs.length && !S.tabs.some(t => t.id === S.activeTab)) S.activeTab = S.tabs[0].id;

  // tabs
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  S.tabs.forEach(tab => {
    const list = tabTasks(tab.id);
    const left = list.filter(t => !t.done).length;
    const b = document.createElement("button");
    b.className = "tab" + (tab.id === S.activeTab ? " on" : "");
    b.innerHTML = esc(tab.name) + (left ? '<span class="n">' + left + '</span>' : '');
    b.addEventListener("click", () => {
      if(tab.id === S.activeTab) return openTabSheet(tab);
      S.activeTab = tab.id; reorderId = null; render(); save();
    });
    tabsEl.appendChild(b);
  });
  const addTab = document.createElement("button");
  addTab.className = "tab-add"; addTab.textContent = "＋"; addTab.setAttribute("aria-label","Add tab");
  addTab.addEventListener("click", () => openTabSheet(null));
  tabsEl.appendChild(addTab);

  // body
  mainEl.innerHTML = "";
  const tab = activeTab();
  if(!tab){
    mainEl.innerHTML = '<p class="empty">No tabs yet. Tap ＋ above to make your first one.</p>';
    document.getElementById("track").style.width = "0%";
    renderLog(); return;
  }

  const list = tabTasks(tab.id);
  const done = list.filter(t => t.done).length;

  const head = document.createElement("div");
  head.className = "tabhead";
  head.innerHTML = '<h2>' + esc(tab.name) + '</h2><span class="meta">' + done + ' / ' + list.length + '</span>';
  mainEl.appendChild(head);
  if(tab.note){ const p = document.createElement("p"); p.className = "tabnote"; p.textContent = tab.note; mainEl.appendChild(p); }

  if(!list.length){
    const e = document.createElement("p"); e.className = "empty"; e.textContent = "Nothing here yet.";
    mainEl.appendChild(e);
  }

  list.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "task" + (t.done ? " done" : "") + (reorderId === t.id ? " drag" : "");

    const bits = [];
    if(t.date) bits.push('<span class="due ' + dueClass(t) + '">' + esc(fmtDue(t)) + '</span>');
    if(t.reminders && t.reminders.length) bits.push('<span>' + t.reminders.length + ' reminder' + (t.reminders.length>1?"s":"") + '</span>');
    if(t.expires) bits.push('<span class="exp">' + (expired(t) ? "Expired" : "Expires " + esc(t.expires)) + '</span>');
    if(t.notes) bits.push('<span>Note</span>');

    el.innerHTML =
      '<div class="row">' +
        '<button class="tick" aria-label="Toggle"><i>✓</i></button>' +
        '<button class="body"><span class="t-title">' + esc(t.title) + '</span>' +
          (bits.length ? '<span class="t-sub">' + bits.join("") + '</span>' : '') +
        '</button>' +
        '<button class="kill" data-task="' + t.id + '" aria-label="Delete">✕</button>' +
      '</div>' +
      (reorderId === t.id
        ? '<div class="movers">' +
            '<button data-up="' + t.id + '"' + (i === 0 ? " disabled" : "") + '>↑ Up</button>' +
            '<button data-down="' + t.id + '"' + (i === list.length-1 ? " disabled" : "") + '>↓ Down</button>' +
            '<button class="go" data-stop="1">Done</button>' +
          '</div>'
        : '');

    el.querySelector(".tick").addEventListener("click", () => toggle(t.id));
    const body = el.querySelector(".body");
    body.addEventListener("click", () => { if(reorderId !== t.id) openTaskSheet(t); });
    holdToReorder(body, t.id);
    mainEl.appendChild(el);
  });

  const add = document.createElement("button");
  add.className = "add"; add.innerHTML = '<b>＋</b> Add task';
  add.addEventListener("click", () => openTaskSheet(null));
  mainEl.appendChild(add);

  document.getElementById("track").style.width = (list.length ? done/list.length*100 : 0) + "%";
  renderLog();
}

function logHTML(){
  return S.log.slice(0,120).map(e =>
    '<div class="log-item"><time>' + new Date(e.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) + '</time><span>' + esc(e.msg) + '</span></div>'
  ).join("") || '<div class="log-item"><span>Nothing logged yet.</span></div>';
}
function renderLog(){}

/* ============================ actions ============================ */
function toggle(id){
  const t = S.tasks.find(x => x.id === id); if(!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null; t.updatedAt = Date.now();
  commit((t.done ? "Completed" : "Reopened") + ' "' + t.title + '"');
}
function move(id, dir){
  const t = S.tasks.find(x => x.id === id); if(!t) return;
  const list = tabTasks(t.tabId);
  const i = list.findIndex(x => x.id === id);
  const j = i + dir;
  if(j < 0 || j >= list.length) return;
  const a = list[i].order, b = list[j].order;
  list[i].order = b; list[j].order = a;
  list[i].updatedAt = Date.now();
  commit('Moved "' + t.title + '" ' + (dir < 0 ? "up" : "down"));
}
function holdToReorder(el, id){
  let timer = null;
  const start = () => { timer = setTimeout(() => { reorderId = id; if(navigator.vibrate) navigator.vibrate(12); render(); }, 480); };
  const stop = () => { clearTimeout(timer); };
  el.addEventListener("touchstart", start, {passive:true});
  el.addEventListener("touchend", stop);
  el.addEventListener("touchmove", stop, {passive:true});
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", stop);
  el.addEventListener("mouseleave", stop);
}

function armed(btn, label, go){
  if(btn.classList.contains("arm")){ go(); return; }
  document.querySelectorAll(".arm").forEach(b => { b.classList.remove("arm"); if(b.dataset.was) b.textContent = b.dataset.was; });
  btn.dataset.was = btn.textContent; btn.textContent = label; btn.classList.add("arm");
  setTimeout(() => { if(btn.classList.contains("arm")){ btn.classList.remove("arm"); btn.textContent = btn.dataset.was; } }, 3000);
}

document.addEventListener("click", e => {
  const k = e.target.closest(".kill");
  if(k){ const t = S.tasks.find(x => x.id === k.dataset.task);
    armed(k, "Delete", () => { S.tasks = S.tasks.filter(x => x.id !== k.dataset.task); commit('Deleted "' + (t?t.title:"task") + '"'); });
    return; }
  const up = e.target.closest("[data-up]");   if(up){ move(up.dataset.up, -1); return; }
  const dn = e.target.closest("[data-down]"); if(dn){ move(dn.dataset.down, 1); return; }
  if(e.target.closest("[data-stop]")){ reorderId = null; render(); }
});

const scrim = document.getElementById("scrim"), sheet = document.getElementById("sheet");
const sFields = document.getElementById("sheetFields"), sExtra = document.getElementById("sheetExtra");

scrim.addEventListener("click", closeSheet);

sheet.addEventListener("click", e => {
  const c = e.target.closest(".chip");

/* ---------- tabs ---------- */
function openTabSheet(tab){
  const editing = !!tab;
  openSheet(editing ? "Edit tab" : "New tab",
    editing ? "Rename it, or take it away along with everything in it." : "A tab is just a group. Anything you like.",
    '<div class="field"><label for="tName">Name</label><input id="tName" type="text" placeholder="Work" autocomplete="off" value="' + esc(editing ? tab.name : "") + '" /></div>' +
    '<div class="field"><label for="tNote">Note</label><textarea id="tNote" placeholder="Optional line describing this tab.">' + esc(editing ? (tab.note||"") : "") + '</textarea></div>',
    () => {
      const name = document.getElementById("tName").value.trim();
      if(!name){ document.getElementById("tName").focus(); return; }
      const note = document.getElementById("tNote").value.trim();
      if(editing){ const old = tab.name; tab.name = name; tab.note = note; closeSheet(); commit(old === name ? 'Edited tab "' + name + '"' : 'Renamed tab "' + old + '" to "' + name + '"'); }
      else { const id = uid(); S.tabs.push({ id, name, note, createdAt: Date.now() }); S.activeTab = id; closeSheet(); commit('Added tab "' + name + '"'); }
    },
    editing ? '<button class="danger" id="delTab">Delete tab and its tasks</button>' : ''
  );
  if(editing){
    setTimeout(() => {
      const d = document.getElementById("delTab");
      if(d) d.addEventListener("click", () => armed(d, "Tap again to delete", () => {
        const n = tabTasks(tab.id).length;
        S.tasks = S.tasks.filter(t => t.tabId !== tab.id);
        S.tabs = S.tabs.filter(t => t.id !== tab.id);
        if(S.activeTab === tab.id) S.activeTab = S.tabs.length ? S.tabs[0].id : "";
        closeSheet(); commit('Deleted tab "' + tab.name + '" and ' + n + ' task' + (n===1?"":"s"));
      }));
    }, 40);
  }
}

/* ---------- tasks ---------- */
function openTaskSheet(task){
  if(!S.tabs.length){ openTabSheet(null); return; }
  const editing = !!task;
  const t = task || { title:"", notes:"", tabId: S.activeTab, date:"", time:"", expires:"", reminders:[] };

  const tabOpts = S.tabs.map(x => '<option value="' + x.id + '"' + (x.id === t.tabId ? " selected" : "") + '>' + esc(x.name) + '</option>').join("");
  const chips = REMINDERS.map(r =>
    '<button type="button" class="chip' + ((t.reminders||[]).includes(r.v) ? " on" : "") + '" data-rem="' + r.v + '">' + r.l + '</button>').join("");

  openSheet(editing ? "Edit task" : "New task", "",
    '<div class="field"><label for="kTitle">Task</label><input id="kTitle" type="text" placeholder="What needs doing" autocomplete="off" value="' + esc(t.title) + '" /></div>' +
    '<div class="field"><label for="kTab">Tab</label><select id="kTab">' + tabOpts + '</select></div>' +
    '<div class="two">' +
      '<div class="field"><label for="kDate">Date</label><input id="kDate" type="date" value="' + esc(t.date) + '" /></div>' +
      '<div class="field"><label for="kTime">Time</label><input id="kTime" type="time" value="' + esc(t.time) + '" /></div>' +
    '</div>' +
    '<p class="hint" id="kDay"></p>' +
    '<div class="field"><label>Reminders — pick as many as you want</label><div class="chips">' + chips + '</div>' +
      '<p class="hint">Counted back from the date and time above.</p></div>' +
    '<div class="field"><label for="kExp">Expires on</label><input id="kExp" type="date" value="' + esc(t.expires) + '" />' +
      '<p class="hint">After this the task is marked expired. Leave blank if it never goes stale.</p></div>' +
    '<div class="field"><label for="kNotes">Notes</label><textarea id="kNotes" placeholder="Anything worth remembering.">' + esc(t.notes || "") + '</textarea></div>',
    () => {
      const title = document.getElementById("kTitle").value.trim();
      if(!title){ document.getElementById("kTitle").focus(); return; }
      const rems = [...sheet.querySelectorAll(".chip.on")].map(c => Number(c.dataset.rem)).sort((a,b) => a-b);
      const data = {
        title,
        tabId: document.getElementById("kTab").value,
        date: document.getElementById("kDate").value,
        time: document.getElementById("kTime").value,
        expires: document.getElementById("kExp").value,
        notes: document.getElementById("kNotes").value.trim(),
        reminders: rems,
        updatedAt: Date.now()
      };
      if(editing){ Object.assign(task, data); closeSheet(); commit('Edited "' + title + '"'); }
      else {
        const maxOrder = Math.max(0, ...S.tasks.filter(x => x.tabId === data.tabId).map(x => x.order || 0));
        S.tasks.push(Object.assign({ id: uid(), createdAt: Date.now(), done:false, doneAt:null, order: maxOrder + 1 }, data));
        closeSheet(); commit('Added "' + title + '"');
      }
    },
    editing ? '<button class="danger" id="icsBtn" style="color:var(--fg-2)">Add to calendar (.ics)</button>' : ''
  );

  setTimeout(() => {
    const d = document.getElementById("kDate"), day = document.getElementById("kDay");
    const showDay = () => { day.textContent = d.value ? DAYS[new Date(d.value + "T00:00:00").getDay()] : ""; };
    d.addEventListener("change", showDay); showDay();
    const ics = document.getElementById("icsBtn");
    if(ics) ics.addEventListener("click", () => downloadICS(task));
  }, 40);
}

/* ============================ calendar export ============================ */
function pad2(n){ return String(n).padStart(2,"0"); }
function icsStamp(d){ return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+"T"+pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+"00Z"; }
function icsEsc(x){ return String(x).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n"); }
function vevent(t){
  const L = ["BEGIN:VEVENT","UID:"+t.id+"@tracker","DTSTAMP:"+icsStamp(new Date())];
  if(t.time){
    const [h,m] = t.time.split(":");
    L.push("DTSTART:"+t.date.replace(/-/g,"")+"T"+h+m+"00", "DURATION:PT30M");
  } else {
    L.push("DTSTART;VALUE=DATE:"+t.date.replace(/-/g,""));
  }
  L.push("SUMMARY:"+icsEsc(t.title));
  if(t.notes) L.push("DESCRIPTION:"+icsEsc(t.notes));
  (t.reminders||[]).forEach(m => {
    L.push("BEGIN:VALARM",
      "TRIGGER:"+(m === 0 ? "PT0M" : "-PT"+(m>=1440 ? (m/1440)+"D" : m>=60 ? (m/60)+"H" : m+"M")),
      "ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"END:VALARM");
  });
  L.push("END:VEVENT");
  return L;
}
function saveICS(lines, name){
  const blob = new Blob([lines.join("\r\n")], { type:"text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^a-z0-9]+/gi,"-").toLowerCase().slice(0,40) + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function downloadICS(t){
  if(!t.date){ alert("Give the task a date first."); return; }
  saveICS(["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tracker//EN","CALSCALE:GREGORIAN", ...vevent(t), "END:VCALENDAR"], t.title);
  logIt('Exported "' + t.title + '" to calendar'); save();
}

/* ============================ reminders ============================ */
let notifMsg = "Off";
function notifState(){
  if(!("Notification" in window)) return { kind:"off", msg:"Not supported" };
  if(Notification.permission === "granted") return { kind:"on", msg:"On" };
  if(Notification.permission === "denied") return { kind:"err", msg:"Blocked" };
  return { kind:"", msg:"Off" };
}
function notifSet(){
  const st = notifState(); notifMsg = st.msg;
  const b = document.getElementById("bNotif"), tool = document.getElementById("btnNotif");
  if(b) b.className = "badge" + (st.kind ? " " + st.kind : "");
  if(tool) tool.classList.toggle("live", st.kind === "on");
  const row = document.getElementById("mNotifStatus"); if(row) row.textContent = st.msg;
}
async function askNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission === "granted"){ new Notification("Tracker", { body:"Reminders are working." }); return; }
  if(Notification.permission === "denied"){
    openSheet("Reminders blocked",
      "Safari remembers a refusal, and there is no way to re-ask from inside the page.",
      '<p class="hint">On iPhone: Settings → Apps → Safari → Advanced → Website Data, find this site, swipe to delete, then reload and allow. On a Mac: Safari → Settings → Websites → Notifications.' +
      '<br><br>Either way, iOS will not fire reminders while the app is closed. Open any task with a date and use <b>Add to calendar</b> for reminders that actually arrive.</p>', null);
    return;
  }
  const p = await Notification.requestPermission();
  notifSet(); logIt("Notification permission: " + p); save();
}

function tick(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = Date.now();
  let changed = false;
  S.tasks.forEach(t => {
    if(t.done || !t.date || !t.reminders || !t.reminders.length) return;
    const due = dueDate(t); if(!due) return;
    t.reminders.forEach(m => {
      const at = due.getTime() - m*60000;
      const key = t.id + ":" + t.date + t.time + ":" + m;
      if(S.fired[key]) return;
      if(at <= now && now - at < 3600000){
        const tab = S.tabs.find(x => x.id === t.tabId);
        new Notification(t.title, { body: (m === 0 ? "Due now" : "Due in " + (REMINDERS.find(r=>r.v===m)||{l:m+" min"}).l) + (tab ? " · " + tab.name : ""), tag: key });
        S.fired[key] = now; changed = true;
        logIt('Reminder fired for "' + t.title + '"');
      }
    });
  });
  if(changed) save();
}
setInterval(tick, 30000);

/* ============================ menu ============================ */
const IC = {
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  sync:'<svg viewBox="0 0 24 24"><path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.4 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
  reload:'<svg viewBox="0 0 24 24"><path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>'
};

function menuRow(icon, label, status, hot){
  return '<button class="mrow' + (hot ? " hot" : "") + '" data-go="' + label + '">' +
    '<span class="ic">' + icon + '</span>' +
    '<span class="lab"><b>' + label + '</b><span' + (status && status.id ? ' id="' + status.id + '"' : '') + '>' + esc(status && status.text || "") + '</span></span>' +
    '<span class="chev">›</span></button>';
}

function openMenu(){
  const st = notifState();
  openSheet("Options", "",
    menuRow(IC.gear,  "Settings",  { text:"Title and intro" }) +
    menuRow(IC.bell,  "Reminders", { text: st.msg, id:"mNotifStatus" }, st.kind === "on") +
    menuRow(IC.sync,  "Sync setup", { text: syncMsg, id:"mSyncStatus" }, SYNC.on) +
    menuRow(IC.reload,"Reload app", { text:"Fetch the latest version" }) +
    menuRow(IC.cal,   "Export calendar", { text:"Every dated task as .ics" }) +
    menuRow(IC.clock, "History",   { text:"Everything that happened" }) +
    menuRow(IC.trash, "Erase everything", { text:"Cannot be undone" }),
    null);
  setTimeout(() => {
    sheet.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.go;
      if(k === "Settings") openSettings();
      else if(k === "Reminders") askNotif();
      else if(k === "Sync setup") openSyncSheet();
      else if(k === "Reload app") hardReload();
      else if(k === "Export calendar") exportAll();
      else if(k === "History") openHistory();
      else if(k === "Erase everything") openWipe();
    }));
  }, 40);
}

function openHistory(){
  openSheet("History", S.log.length + " entr" + (S.log.length === 1 ? "y" : "ies") + " · newest first",
    '<div class="log">' + logHTML() + '</div>', null);
}

function openSettings(){
  openSheet("Settings", "Names shown at the top of the app.",
    '<div class="field"><label for="sEye">Small label</label><input id="sEye" type="text" value="' + esc(S.eyebrow) + '" /></div>' +
    '<div class="field"><label for="sTitle">Title</label><input id="sTitle" type="text" value="' + esc(S.title) + '" /></div>' +
    '<div class="field"><label for="sIntro">Intro line</label><textarea id="sIntro">' + esc(S.intro) + '</textarea></div>',
    () => {
      S.eyebrow = document.getElementById("sEye").value.trim() || "Tracker";
      S.title   = document.getElementById("sTitle").value.trim() || "Tracker";
      S.intro   = document.getElementById("sIntro").value.trim();
      closeSheet(); commit("Updated settings");
    });
}

function openWipe(){
  openSheet("Erase everything", "Every tab, task and log entry on this device — and in the synced store if sync is on.",
    '<p class="hint">There is no undo. If you only want a clean slate for one area, delete that tab instead.</p>',
    null, '<button class="danger" id="wipe">Erase everything</button>');
  setTimeout(() => {
    const w = document.getElementById("wipe");
    if(w) w.addEventListener("click", () => armed(w, "Tap again to erase", async () => {
      S = EMPTY(); S.updatedAt = Date.now();
      const id = uid(); S.tabs = [{ id, name:"Today", note:"", createdAt: Date.now() }]; S.activeTab = id;
      closeSheet(); render();
      await store.set(KEY, JSON.stringify(S)); schedulePush();
    }));
  }, 40);
}

function exportAll(){
  const dated = S.tasks.filter(t => t.date && !t.done);
  if(!dated.length){ openSheet("Nothing to export", "", '<p class="hint">No open tasks have a date yet.</p>', null); return; }
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tracker//EN","CALSCALE:GREGORIAN"];
  dated.forEach(t => L.push(...vevent(t)));
  L.push("END:VCALENDAR");
  saveICS(L, "tracker-" + new Date().toISOString().slice(0,10));
  logIt("Exported " + dated.length + " task" + (dated.length===1?"":"s") + " to calendar"); save();
  closeSheet();
}

function openSyncSheet(){
  const on = SYNC.on;
  openSheet(on ? "Sync" : "Set up sync",
    on ? "Your data lives in a secret GitHub Gist. Use the same token and store ID on every device."
       : "Keep every device in step by storing the data in a secret GitHub Gist.",
    '<p class="hint"><b>One-time setup.</b> Fastest route: open ' +
      '<a href="https://github.com/settings/personal-access-tokens/new?name=Tracker+sync&amp;gists=write&amp;expires_in=366" target="_blank" rel="noopener" style="color:var(--accent)">this pre-filled link</a>' +
      ' and press Generate token. Or by hand:' +
      '<ol><li>Settings → Developer settings → <b>Fine-grained tokens</b></li>' +
      '<li>Resource owner must be <b>your own account</b></li>' +
      '<li>Account permissions → <b>Gists</b> → <b>Write</b></li></ol></p>' +
    '<div class="field"><label for="gTok">GitHub token</label><input id="gTok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false" value="' + esc(SYNC.token) + '" /></div>' +
    '<div class="field"><label for="gId">Store ID — empty creates a new one</label><input id="gId" type="text" autocomplete="off" spellcheck="false" value="' + esc(SYNC.gist) + '" /></div>' +
    (on ? '<div class="field"><label>Paste this on your other devices</label><div class="idbox"><code>' + esc(SYNC.gist) + '</code><button type="button" id="cpId">Copy</button></div></div>' : '') +
    '<p class="hint" id="gMsg"></p>',
    async () => {
      const msg = document.getElementById("gMsg");
      const tok = document.getElementById("gTok").value.trim();
      const gid = document.getElementById("gId").value.trim();
      if(!tok){ document.getElementById("gTok").focus(); return; }
      SYNC.token = tok; msg.textContent = "Connecting…";
      try{
        if(gid){
          SYNC.gist = gid;
          const r = await SYNC.pull();
          if(r && (r.updatedAt||0) > (S.updatedAt||0)){ S = norm(r); await store.set(KEY, JSON.stringify(S)); }
          else await SYNC.push(S);
        } else { S.updatedAt = Date.now(); SYNC.gist = await SYNC.create(S); }
        lastSynced = Date.now(); closeSheet(); render(); syncIdle();
        logIt("Sync connected"); save();
      }catch(e){ msg.textContent = "Failed: " + (e.message || e) + ". Check the Gists permission is set to Write."; }
    });
  setTimeout(() => {
    const c = document.getElementById("cpId");
    if(c) c.addEventListener("click", () => { if(navigator.clipboard) navigator.clipboard.writeText(SYNC.gist); c.textContent = "Copied"; setTimeout(()=>c.textContent="Copy",1500); });
  }, 40);
}

/* ============================ refresh ============================ */
let refreshing = false;
async function refreshNow(){
  if(refreshing) return;
  refreshing = true;
  const tool = document.getElementById("btnSync");
  const ptr  = document.getElementById("ptr");
  tool.classList.add("spin"); ptr.classList.add("busy");
  try{
    if(SYNC.on) await doPull();
    else { render(); notifSet(); }
    tick();
  } finally {
    setTimeout(() => {
      tool.classList.remove("spin"); ptr.classList.remove("busy");
      refreshing = false;
    }, 550);
  }
}

/* iOS keeps a home-screen web app on the version it first cached.
   This forces the browser past that copy. */
function hardReload(){
  const url = location.pathname + "?v=" + Date.now() + location.hash;
  location.replace(url);
}

/* pull down at the top of the page to refresh */
(function pullToRefresh(){
  const ptr = document.getElementById("ptr");
  let startY = 0, active = false;
  document.addEventListener("touchstart", e => {
    active = window.scrollY <= 0 && !sheet.classList.contains("open") && !refreshing;
    if(active) startY = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener("touchmove", e => {
    if(!active) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || window.scrollY > 0){ ptr.style.transform = ""; ptr.style.opacity = ""; ptr.classList.remove("ready"); return; }
    const d = Math.min(dy * 0.55, 70);
    ptr.style.transform = "translateY(" + (d - 58) + "px)";
    ptr.style.opacity = Math.min(d / 38, 1);
    ptr.classList.toggle("ready", d >= 40);
  }, { passive:true });
  const end = () => {
    if(!active) return;
    active = false;
    const go = ptr.classList.contains("ready");
    ptr.style.transform = ""; ptr.style.opacity = ""; ptr.classList.remove("ready");
    if(go){ if(navigator.vibrate) navigator.vibrate(10); refreshNow(); }
  };
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);
})();

document.getElementById("btnMenu").addEventListener("click", openMenu);
document.getElementById("btnLog").addEventListener("click", openHistory);
document.getElementById("btnNotif").addEventListener("click", askNotif);
document.getElementById("btnSync").addEventListener("click", refreshNow);

document.getElementById("fab").addEventListener("click", () => openTaskSheet(null));
document.addEventListener("visibilitychange", () => { if(!document.hidden){ doPull(true); tick(); } });
window.addEventListener("online", () => doPull(true));

/* ============================ boot ============================ */
(async function boot(){
  try{ const raw = await store.get(KEY); if(raw) S = norm(JSON.parse(raw)); }catch(e){}
  if(!S.tabs.length){
    const id = uid();
    S.tabs = [{ id, name:"Today", note:"", createdAt: Date.now() }];
    S.activeTab = id;
    logIt("Created first tab");
  }
  render(); notifSet(); tick();
  if(SYNC.on){ await doPull(); }
  else syncIdle();
})();
</script>
